[project]
name = "additional-benchmarks"
version = "0.1.0"
description = "Comparison experiments for Reviewer 1"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "matplotlib",
    "numpy",
    "pylatexenc>=2.11",
    "qiskit",
    "pyzx==0.10.6", # Used directly for logical-equivalence checks; also pinned by TopoLS.
    "topols",
    "tqec",
]

[tool.uv.sources]
topols = { path = "external/TopoLS", editable = true }
tqec = { path = "external/tqec", editable = true }
