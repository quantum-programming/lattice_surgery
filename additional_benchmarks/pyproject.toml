[project]
name = "additional-benchmarks"
version = "0.1.0"
description = "Comparison experiments for Reviewer 1"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "matplotlib",
    "numpy",
    "pylatexenc>=2.11",
    "qiskit",
    "pyzx==0.10.6", # Used directly for logical-equivalence checks; also pinned by TopoLS.
    "topols",
    "tqec",
]

[tool.uv.sources]
topols = { path = "external/TopoLS", editable = true }
tqec = { path = "external/tqec", editable = true }

# Check our sources only. The input generator is a separate project below.
[tool.mypy]
files = ["scripts", "tests"]
python_version = "3.13"
python_executable = ".venv/Scripts/python.exe"
mypy_path = ["scripts"]
follow_imports = "silent"

# These upstream packages provide no py.typed marker.
[[tool.mypy.overrides]]
module = ["qiskit.*", "topols.*"]
ignore_missing_imports = true

[tool.pyright]
include = ["scripts", "tests", "benchmarks/generate_benchmarks.py"]
exclude = ["external", "work", "benchmarks/work"]
pythonVersion = "3.13"
extraPaths = ["scripts", ".venv/Lib/site-packages", "external/TopoLS/src", "external/tqec/src"]
executionEnvironments = [
    { root = "benchmarks", extraPaths = ["benchmarks/.venv/Lib/site-packages"] },
    { root = "." },
]
