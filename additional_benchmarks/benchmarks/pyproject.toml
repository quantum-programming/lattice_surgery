[project]
name = "reviewer-benchmark-inputs"
version = "0.1.0"
description = "Optional, isolated environment for reproducing the MQT inputs"
requires-python = ">=3.13,<3.14"
dependencies = [
    "mqt-qecc==2.0.0",
    "pylatexenc>=2.11",
]

[tool.uv]
package = false

[tool.mypy]
files = ["generate_benchmarks.py"]
python_version = "3.13"
python_executable = "work/venv-inputs-windows/Scripts/python.exe"
follow_imports = "silent"

[[tool.mypy.overrides]]
module = ["qiskit.*"]
ignore_missing_imports = true

[tool.pyright]
include = ["generate_benchmarks.py"]
exclude = ["work"]
pythonVersion = "3.13"
extraPaths = ["work/venv-inputs-windows/Lib/site-packages"]
